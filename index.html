<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#eef0ea" />
<meta name="description" content="A shared family shopping list." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Shopping List" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>Shopping List</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#eef0ea; --card:#fbfbf8; --card-edge:#e4e6de;
    --ink:#232219; --ink-soft:#6d6b5f; --ink-faint:#a6a498; --line:#e0e2d9;
    --pen:#2a27c4; --pen-ink:#211fa0; --pen-wash:#ecebfb;
    --fresh:#3c8a57; --alert:#c23d2b;
    --r-sm:6px; --r-md:12px; --r-lg:20px;
    --font-display:'Bricolage Grotesque', system-ui, sans-serif;
    --font-mono:'Space Mono', ui-monospace, monospace;
    --tap:48px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--paper); color:var(--ink);
    font-family:var(--font-display); -webkit-font-smoothing:antialiased; }
  button { font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input { font:inherit; color:inherit; }
  :focus-visible { outline:2.5px solid var(--pen); outline-offset:2px; border-radius:3px; }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.001ms!important; transition-duration:.001ms!important; } }

  .mark { display:grid; place-items:center; background:var(--pen); color:#fff; border-radius:14px; transform:rotate(-5deg); }
  .boot { min-height:100dvh; display:grid; place-items:center; }
  .boot .mark { width:52px; height:52px; font-size:1.5rem; animation:tilt 1.4s ease-in-out infinite alternate; }
  @keyframes tilt { from{transform:rotate(-5deg);} to{transform:rotate(5deg);} }

  /* welcome */
  .wrap { max-width:26rem; margin:0 auto; padding:2.4rem 1.4rem 3rem; display:flex; flex-direction:column; gap:.9rem; }
  .hero { text-align:center; margin-bottom:1rem; }
  .hero .mark { width:56px; height:56px; font-size:1.6rem; margin:0 auto 1.2rem; }
  h1 { font-size:2rem; line-height:1.05; font-weight:700; letter-spacing:-.03em; margin:0 0 .8rem; }
  .lede { color:var(--ink-soft); line-height:1.55; margin:0; }
  .primary { height:52px; background:var(--pen); color:#fff; font-weight:600; font-size:1rem;
    border-radius:var(--r-md); transition:background .15s, opacity .15s; }
  .primary:disabled { opacity:.4; }
  .primary:not(:disabled):hover { background:var(--pen-ink); }
  .subtle { text-align:center; color:var(--ink-faint); font-size:.9rem; margin:.2rem 0 0; line-height:1.5; }

  /* list */
  .bar { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.1rem .4rem; }
  .brand { display:flex; align-items:center; gap:.5rem; }
  .brand .mark { width:28px; height:28px; font-size:.9rem; border-radius:8px; transform:rotate(-4deg); }
  .bar h1 { font-size:1.15rem; margin:0; letter-spacing:-.02em; }
  .share { display:flex; align-items:center; gap:.35rem; font-weight:600; font-size:.85rem;
    color:var(--pen-ink); background:var(--pen-wash); padding:.5rem .85rem; border-radius:999px; }
  .share:hover { background:#e2e0fb; }
  .status { display:flex; align-items:center; gap:.4rem; padding:0 1.2rem .7rem;
    font-family:var(--font-mono); font-size:.72rem; color:var(--ink-soft); }
  .status .dot { width:7px; height:7px; border-radius:50%; background:var(--ink-faint); }
  .status.live .dot { background:var(--fresh); }
  .status.err { color:var(--alert); } .status.err .dot { background:var(--alert); }

  .banner { margin:0 1.1rem .6rem; padding:.85rem 1rem; background:var(--card); border:2px solid var(--pen-wash);
    border-radius:var(--r-md); display:flex; align-items:center; gap:.75rem; }
  .banner p { margin:0; font-size:.9rem; line-height:1.45; color:var(--ink); flex:1; }
  .banner .b-share { font-weight:600; font-size:.85rem; color:#fff; background:var(--pen);
    padding:.5rem .85rem; border-radius:var(--r-sm); white-space:nowrap; }
  .banner .b-share:hover { background:var(--pen-ink); }
  .banner .dismiss { color:var(--ink-faint); font-size:1.3rem; line-height:1; padding:.2rem; }

  .add { position:sticky; top:0; z-index:5; display:flex; gap:.5rem; padding:.5rem 1.1rem .7rem;
    background:linear-gradient(var(--paper) 78%, transparent); }
  .add input { flex:1; min-width:0; height:var(--tap); padding:0 1rem; border:2px solid var(--card-edge);
    border-radius:var(--r-md); background:var(--card); font-size:1rem; }
  .add input:focus { border-color:var(--pen); outline:none; }
  .add-btn { height:var(--tap); padding:0 1.2rem; background:var(--pen); color:#fff; font-weight:600;
    border-radius:var(--r-md); transition:background .15s, opacity .15s; }
  .add-btn:disabled { opacity:.4; }
  .add-btn:not(:disabled):hover { background:var(--pen-ink); }
  main { padding:0 1.1rem 6rem; }
  ul.items { list-style:none; margin:0; padding:0; }
  .empty { margin-top:20vh; text-align:center; padding:0 2rem; }
  .empty-head { font-size:1.15rem; font-weight:600; margin:0 0 .4rem; }
  .empty-sub { color:var(--ink-soft); margin:0; line-height:1.5; }
  .done-head { display:flex; align-items:center; justify-content:space-between; margin:1.6rem 0 .2rem;
    font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); }
  .clear { color:var(--pen-ink); } .clear:hover { text-decoration:underline; }

  .row { display:grid; grid-template-columns:var(--tap) 1fr auto; align-items:center;
    min-height:56px; padding:.35rem .25rem .35rem 0; border-bottom:1px solid var(--line); }
  .tick { height:var(--tap); display:grid; place-items:center; }
  .box { width:22px; height:22px; border:2.5px solid var(--pen); border-radius:6px; transition:background .15s; }
  .row.done .box { background:var(--pen); box-shadow:inset 0 0 0 3px var(--card); }
  .rbody { display:flex; align-items:baseline; gap:.6rem; min-width:0; }
  .name { flex:1; min-width:0; font-size:1.06rem; font-weight:500; letter-spacing:-.01em; color:var(--ink);
    line-height:1.3; overflow-wrap:anywhere; transition:color .2s ease; }
  .row.done .name { color:var(--ink-faint); text-decoration:line-through;
    text-decoration-color:var(--pen); text-decoration-thickness:2.5px; }
  .qty, .qty-input { font-family:var(--font-mono); font-size:.8rem; color:var(--ink-soft); flex-shrink:0; }
  .qty { padding:4px 6px; border-radius:var(--r-sm); }
  .qty:hover { background:var(--pen-wash); color:var(--pen-ink); }
  .row.done .qty { color:var(--ink-faint); }
  .qty-input { width:5.5rem; padding:4px 6px; border:1px solid var(--pen); border-radius:var(--r-sm); background:var(--card); }
  .del { width:var(--tap); height:var(--tap); font-size:1.5rem; line-height:1; color:var(--ink-faint); border-radius:var(--r-sm); }
  .del:hover { color:var(--alert); }

  .toast { position:fixed; left:50%; bottom:1.5rem; transform:translateX(-50%); z-index:20;
    background:var(--ink); color:#fff; font-size:.9rem; padding:.7rem 1.1rem; border-radius:999px;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="app"><div class="boot"><span class="mark">✓</span></div></div>

<!-- If the app never boots (file:// , a preview, or no connection), say so. -->
<script>
  window.__bootTimer = setTimeout(function () {
    if (window.__booted) return;
    document.getElementById('app').innerHTML =
      '<div style="max-width:30rem;margin:18vh auto;padding:0 1.6rem;font-family:system-ui,sans-serif;color:#232219;text-align:center">' +
      '<h2 style="font-size:1.25rem;margin:0 0 .6rem">Open this in a browser, over HTTPS</h2>' +
      '<p style="color:#6d6b5f;line-height:1.55">This didn’t load — it was probably opened from a file preview or without a connection. Host it over HTTPS and open the URL in your browser.</p></div>';
  }, 8000);
</script>
<script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('[sw]', e)));
  }
</script>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.23.1';
import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.23.1/hooks?deps=preact@10.23.1';
import htm from 'https://esm.sh/htm@3.1.1';
import { SimplePool } from 'https://esm.sh/nostr-tools@2.10.4/pool';
import { finalizeEvent, getPublicKey, generateSecretKey } from 'https://esm.sh/nostr-tools@2.10.4/pure';
import * as nip19 from 'https://esm.sh/nostr-tools@2.10.4/nip19';
import { v2 as nip44v2 } from 'https://esm.sh/nostr-tools@2.10.4/nip44';
import { sha256 } from 'https://esm.sh/@noble/hashes@1.4.0/sha256';
import { bytesToHex, hexToBytes, utf8ToBytes } from 'https://esm.sh/@noble/hashes@1.4.0/utils';

window.__booted = true;
clearTimeout(window.__bootTimer);
const html = htm.bind(h);

/* --- config --------------------------------------------------------------- */
const DEFAULT_RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.primal.net'];
const LIST_KIND = 30078;
const LIST_NAME = 'groceries';
const MAX_PLAINTEXT_BYTES = 48000;
const TOMBSTONE_TTL_MS = 30 * 24 * 60 * 60 * 1000;

/* --- IndexedDB (a cache; the shareable link is the real backup) ----------- */
const DBN = 'shoppinglist';
let _db;
function db() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('lists'); r.result.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return _db;
}
async function idb(store, mode, fn) {
  try { const d = await db(); return await new Promise((res, rej) => {
    const rq = fn(d.transaction(store, mode).objectStore(store));
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  }); } catch (e) { console.warn('[idb]', e); return undefined; }
}
const getMeta = (k) => idb('meta', 'readonly', (s) => s.get(k));
const setMeta = (k, v) => idb('meta', 'readwrite', (s) => s.put(v, k));
const loadSnap = (id) => idb('lists', 'readonly', (s) => s.get(id));
const saveSnap = (id, snap) => idb('lists', 'readwrite', (s) => s.put(snap, id));
async function requestPersistence() {
  if (!navigator.storage?.persist) return; try { await navigator.storage.persist(); } catch {}
}

/* --- CRDT (validated: commutative / idempotent / associative merge) -------- */
const EMPTY_STATE = { v: 1, items: {} };
function randomHex(n) { const b = new Uint8Array(n); crypto.getRandomValues(b);
  return Array.from(b, (x) => x.toString(16).padStart(2, '0')).join(''); }
const newClientId = () => randomHex(4);
const newItemId = () => randomHex(8);
let lastTs = 0;
function now() { const t = Math.max(Date.now(), lastTs + 1); lastTs = t; return t; }
function observe(t) { if (t > lastTs) lastTs = t; }
const reg = (v, c) => ({ v, t: now(), c });
function mergeReg(a, b) { if (a.t !== b.t) return a.t > b.t ? a : b; if (a.c !== b.c) return a.c > b.c ? a : b; return a; }
function mergeItem(a, b) { return { id: a.id, born: Math.min(a.born, b.born),
  name: mergeReg(a.name, b.name), qty: mergeReg(a.qty, b.qty), note: mergeReg(a.note, b.note),
  cat: mergeReg(a.cat, b.cat), checked: mergeReg(a.checked, b.checked), deleted: mergeReg(a.deleted, b.deleted) }; }
function observeItem(i) { for (const k of ['name','qty','note','cat','checked','deleted']) observe(i[k].t); }
function mergeList(a, b) { const items = { ...a.items };
  for (const [id, bi] of Object.entries(b.items)) { observeItem(bi); items[id] = items[id] ? mergeItem(items[id], bi) : bi; }
  return { v: 1, items }; }
function addItem(s, c, f) { const id = newItemId();
  const item = { id, born: now(), name: reg((f.name || '').trim(), c), qty: reg(f.qty || '', c),
    note: reg(f.note || '', c), cat: reg(f.cat || '', c), checked: reg(false, c), deleted: reg(false, c) };
  return { v: 1, items: { ...s.items, [id]: item } }; }
function setFields(s, c, id, patch) { const cur = s.items[id]; if (!cur) return s;
  const next = { ...cur }; for (const [k, v] of Object.entries(patch)) next[k] = reg(v, c);
  return { v: 1, items: { ...s.items, [id]: next } }; }
const setChecked = (s, c, id, v) => setFields(s, c, id, { checked: v });
const setQty = (s, c, id, v) => setFields(s, c, id, { qty: v });
const removeItem = (s, c, id) => setFields(s, c, id, { deleted: true });
function clearChecked(s, c) { let out = s;
  for (const i of Object.values(s.items)) if (i.checked.v && !i.deleted.v) out = removeItem(out, c, i.id); return out; }
function visibleItems(s) { return Object.values(s.items).filter((i) => !i.deleted.v).sort((a, b) => {
  if (a.checked.v !== b.checked.v) return a.checked.v ? 1 : -1;
  const cat = a.cat.v.localeCompare(b.cat.v); if (cat) return cat; return a.born - b.born; }); }
function pruneTombstones(s, ttl = TOMBSTONE_TTL_MS) { const cutoff = Date.now() - ttl; const items = {};
  for (const [id, i] of Object.entries(s.items)) { if (i.deleted.v && i.deleted.t < cutoff) continue; items[id] = i; }
  return { v: 1, items }; }
function canonical(x) { if (x === null || typeof x !== 'object') return JSON.stringify(x);
  if (Array.isArray(x)) return `[${x.map(canonical).join(',')}]`;
  return `{${Object.keys(x).sort().map((k) => `${JSON.stringify(k)}:${canonical(x[k])}`).join(',')}}`; }
const statesEqual = (a, b) => canonical(a) === canonical(b);

/* --- identity + encryption ------------------------------------------------ */
function identityFrom(sk) { const pubkey = getPublicKey(sk);
  return { sk, pubkey, nsec: nip19.nsecEncode(sk), npub: nip19.npubEncode(pubkey) }; }
const createIdentity = () => identityFrom(generateSecretKey());
function parseNsec(input) { const c = input.trim().replace(/^nostr:/i, '').replace(/\s+/g, '');
  if (!c.startsWith('nsec1')) throw new Error('bad'); const d = nip19.decode(c);
  if (d.type !== 'nsec') throw new Error('bad'); return identityFrom(d.data); }
function deriveDTag(pubkey, listName) {
  return bytesToHex(sha256(utf8ToBytes(`kitchenostr/v1/${pubkey}/${listName}`))).slice(0, 32); }
function makeCipher(sk) { const pubkey = getPublicKey(sk);
  const ck = nip44v2.utils.getConversationKey(sk, pubkey);
  return { pubkey,
    encrypt(state) { const j = JSON.stringify(state);
      if (new TextEncoder().encode(j).length > MAX_PLAINTEXT_BYTES) throw new Error('too large'); return nip44v2.encrypt(j, ck); },
    decrypt(content) { const p = JSON.parse(nip44v2.decrypt(content, ck));
      if (p?.v !== 1 || typeof p.items !== 'object') throw new Error('bad payload'); return p; } }; }

/* --- sync: subscribe → decrypt → merge → republish -----------------------
 *  1. never publish unmerged state (events replace-by-newest at the relay)
 *  2. created_at must beat the newest we've accepted (relays tie-break by id)
 *  3. if our merge differs from a peer's, republish (heals offline devices) */
class ListSync {
  constructor(opts) { this.opts = opts; this.sk = opts.secretKey; this.cipher = makeCipher(opts.secretKey);
    this.dTag = deriveDTag(this.cipher.pubkey, opts.listName); this.relays = opts.relays; this.pool = new SimplePool();
    this.clientId = ''; this.state = EMPTY_STATE; this.lastCreatedAt = 0; this.dirty = false;
    this.sub = null; this.debounce = null; this.retry = null; this.retryDelay = 2000; this.publishing = false; this.seen = new Set(); }
  get listId() { return `${this.cipher.pubkey}:${this.dTag}`; }
  async start() {
    this.clientId = (await getMeta('clientId')) || (await (async () => { const c = newClientId(); await setMeta('clientId', c); return c; })());
    const snap = (await loadSnap(this.listId)) || { state: EMPTY_STATE, lastCreatedAt: 0, dirty: false };
    this.state = snap.state; this.lastCreatedAt = snap.lastCreatedAt; this.dirty = snap.dirty;
    this.opts.onState(this.state); this._subscribe();
    document.addEventListener('visibilitychange', this._wake); addEventListener('online', this._wake);
    if (this.dirty) this._schedule(0); }
  stop() { document.removeEventListener('visibilitychange', this._wake); removeEventListener('online', this._wake);
    clearTimeout(this.debounce); clearTimeout(this.retry); this.sub?.close(); this.pool.close(this.relays); }
  _wake = () => { if (document.visibilityState === 'hidden') return; this._subscribe(); if (this.dirty) this._schedule(0); };
  _subscribe() { this.sub?.close();
    this.sub = this.pool.subscribeMany(this.relays,
      [{ kinds: [LIST_KIND], authors: [this.cipher.pubkey], '#d': [this.dTag] }],
      { onevent: (ev) => this._onRemote(ev), oneose: () => this.opts.onStatus?.({ online: true }) }); }
  _onRemote(ev) { if (this.seen.has(ev.id)) return; this.seen.add(ev.id);
    let incoming; try { incoming = this.cipher.decrypt(ev.content); } catch { return; }
    if (ev.created_at > this.lastCreatedAt) this.lastCreatedAt = ev.created_at; observe(ev.created_at * 1000);
    const merged = mergeList(this.state, incoming);
    const changed = !statesEqual(merged, this.state); const senderBehind = !statesEqual(merged, incoming);
    this.state = merged; this.opts.onStatus?.({ online: true, lastSyncedAt: Date.now() });
    if (changed) this.opts.onState(this.state); if (changed || senderBehind) this._persist();
    if (senderBehind) { this.dirty = true; this._schedule(); } }
  mutate(fn) { const next = fn(this.state, this.clientId); if (statesEqual(next, this.state)) return;
    this.state = next; this.dirty = true; this.opts.onState(this.state); this._persist(); this._schedule(); }
  _schedule(delay = 800) { clearTimeout(this.debounce); this.debounce = setTimeout(() => this._flush(), delay); this.opts.onStatus?.({ pending: true }); }
  async _flush() { if (this.publishing || !this.dirty) return; this.publishing = true; this.dirty = false;
    this.state = pruneTombstones(this.state); const snapshot = this.state;
    try {
      const tmpl = { kind: LIST_KIND, created_at: Math.max(Math.floor(Date.now() / 1000), this.lastCreatedAt + 1),
        tags: [['d', this.dTag]], content: this.cipher.encrypt(snapshot) };
      const signed = finalizeEvent(tmpl, this.sk); this.seen.add(signed.id);
      const results = await Promise.allSettled(this.pool.publish(this.relays, signed));
      if (!results.some((r) => r.status === 'fulfilled')) throw new Error('all relays rejected');
      this.lastCreatedAt = signed.created_at; this.retryDelay = 2000;
      this.opts.onStatus?.({ online: true, pending: this.dirty, lastSyncedAt: Date.now(), error: undefined }); this._persist();
    } catch (e) {
      if (String(e).includes('too large')) { this.opts.onStatus?.({ error: 'List too large', pending: true }); this.publishing = false; return; }
      this.dirty = true; this.opts.onStatus?.({ online: false, pending: true, error: String(e) });
      clearTimeout(this.retry); this.retry = setTimeout(() => this._flush(), this.retryDelay); this.retryDelay = Math.min(this.retryDelay * 2, 60000);
    } finally { this.publishing = false; }
    if (this.dirty) this._schedule(); }
  _persist() { saveSnap(this.listId, { state: this.state, lastCreatedAt: this.lastCreatedAt, dirty: this.dirty }); }
}

/* --- controller ----------------------------------------------------------- */
const store = (() => { let s = { screen: 'loading', items: [], status: { online: false, pending: false }, showSave: false };
  const subs = new Set();
  return { get: () => s, set: (p) => { s = { ...s, ...p }; subs.forEach((f) => f(s)); }, sub: (f) => { subs.add(f); return () => subs.delete(f); } }; })();

let sync = null; let identity = null;

async function adopt(sk) {
  await setMeta('sk', bytesToHex(sk));
  identity = identityFrom(sk);
  await requestPersistence();
  sync?.stop();
  sync = new ListSync({ secretKey: sk, relays: DEFAULT_RELAYS, listName: LIST_NAME,
    onState: (st) => store.set({ items: visibleItems(st) }),
    onStatus: (patch) => store.set({ status: { ...store.get().status, ...patch } }) });
  await sync.start();
}

async function boot() {
  // A shared link carries the key in the URL fragment (never sent to the host).
  const p = new URLSearchParams(location.search);
  const shared = p.get('share_title') || p.get('share_text'); // Web Share Target
  if (shared) { store.set({ pendingAdd: shared.trim() }); history.replaceState(null, '', location.pathname); }

  const linkKey = new URLSearchParams(location.hash.slice(1)).get('k');
  if (linkKey) {
    try {
      await adopt(parseNsec(linkKey).sk);
      history.replaceState(null, '', location.pathname + location.search); // strip the key from the address bar
      store.set({ screen: 'list' });
      return;
    } catch { /* not a valid key — fall through */ }
  }

  const skHex = await getMeta('sk');
  if (skHex) { await adopt(hexToBytes(skHex)); store.set({ screen: 'list' }); }
  else { store.set({ screen: 'welcome' }); }
}

const actions = {
  createList: async () => { await adopt(createIdentity().sk); store.set({ screen: 'list', showSave: true }); },
  shareLink: async () => {
    const url = location.origin + location.pathname + '#k=' + identity.nsec;
    try {
      if (navigator.share) { await navigator.share({ title: 'Our shopping list', text: 'Open our shared shopping list', url }); return 'shared'; }
      await navigator.clipboard.writeText(url); return 'copied';
    } catch (e) { if (String(e).includes('Abort')) return 'shared'; // user cancelled the sheet
      try { await navigator.clipboard.writeText(url); return 'copied'; } catch { return 'fail'; } }
  },
  dismissSave: () => store.set({ showSave: false }),
  add: (name) => { const n = name.trim(); if (n && sync) sync.mutate((s, c) => addItem(s, c, { name: n })); },
  toggle: (it) => sync?.mutate((s, c) => setChecked(s, c, it.id, !it.checked.v)),
  remove: (it) => sync?.mutate((s, c) => removeItem(s, c, it.id)),
  setQty: (it, q) => sync?.mutate((s, c) => setQty(s, c, it.id, q)),
  clearChecked: () => sync?.mutate((s, c) => clearChecked(s, c)),
};

/* --- UI ------------------------------------------------------------------- */
function useStore() { const [s, setS] = useState(store.get()); useEffect(() => store.sub(setS), []); return s; }

function useToast() {
  const [msg, setMsg] = useState('');
  const show = (m) => { setMsg(m); setTimeout(() => setMsg(''), 1800); };
  const node = msg ? html`<div class="toast">${msg}</div>` : null;
  return [node, show];
}

function ShareButton({ className, label, onDone }) {
  const go = async () => {
    const r = await actions.shareLink();
    if (r === 'copied') onDone?.('Link copied — send it to your family');
    else if (r === 'fail') onDone?.('Could not share');
  };
  return html`<button class=${className} onClick=${go}>${label}</button>`;
}

function ItemRow({ item }) {
  const done = item.checked.v;
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState('');
  const commit = () => { setEditing(false); if (draft.trim() !== item.qty.v) actions.setQty(item, draft.trim()); };
  return html`<li class=${'row' + (done ? ' done' : '')}>
    <button class="tick" role="checkbox" aria-checked=${done}
      aria-label=${done ? 'Uncheck ' + item.name.v : 'Check off ' + item.name.v}
      onClick=${() => actions.toggle(item)}><span class="box"></span></button>
    <div class="rbody">
      <span class="name">${item.name.v}</span>
      ${editing
        ? html`<input class="qty-input" autofocus value=${draft} placeholder="qty" aria-label="Quantity"
            onInput=${(e) => setDraft(e.target.value)} onBlur=${commit} onKeyDown=${(e) => e.key === 'Enter' && commit()} />`
        : html`<button class="qty" onClick=${() => { setDraft(item.qty.v); setEditing(true); }}>${item.qty.v || '+ qty'}</button>`}
    </div>
    <button class="del" aria-label=${'Remove ' + item.name.v} onClick=${() => actions.remove(item)}>×</button>
  </li>`;
}

function ListView() {
  const s = useStore();
  const [draft, setDraft] = useState(s.pendingAdd || '');
  const [toast, showToast] = useToast();
  useEffect(() => { if (s.pendingAdd) setDraft(s.pendingAdd); }, [s.pendingAdd]);
  const open = s.items.filter((i) => !i.checked.v);
  const done = s.items.filter((i) => i.checked.v);
  const label = s.status.error ? 'offline — changes saved here'
    : s.status.pending ? 'saving…' : s.status.online ? 'up to date' : 'connecting…';
  const submit = (e) => { e.preventDefault(); actions.add(draft); setDraft(''); };
  return html`<div>
    <header class="bar">
      <div class="brand"><span class="mark">✓</span><h1>Shopping List</h1></div>
      <${ShareButton} className="share" label=${html`<span>Share</span>`} onDone=${showToast} />
    </header>
    <div class=${'status' + (s.status.error ? ' err' : s.status.online && !s.status.pending ? ' live' : '')}>
      <span class="dot"></span>${label}</div>

    ${s.showSave && html`<div class="banner">
      <p>Share this list with your family so everyone can add to it — and so you don’t lose it.</p>
      <${ShareButton} className="b-share" label="Share" onDone=${(m) => { showToast(m); actions.dismissSave(); }} />
      <button class="dismiss" aria-label="Dismiss" onClick=${actions.dismissSave}>×</button>
    </div>`}

    <form class="add" onSubmit=${submit}>
      <input value=${draft} placeholder="Add an item…" aria-label="Add an item" autocomplete="off"
        enterkeyhint="done" onInput=${(e) => setDraft(e.target.value)} />
      <button class="add-btn" type="submit" disabled=${!draft.trim()} aria-label="Add">Add</button>
    </form>
    <main>
      ${s.items.length === 0
        ? html`<div class="empty"><p class="empty-head">Nothing on the list yet.</p>
            <p class="empty-sub">Add the first thing above. Everyone you share the list with sees it.</p></div>`
        : html`<ul class="items">${open.map((it) => html`<${ItemRow} key=${it.id} item=${it} />`)}</ul>
            ${done.length > 0 && html`<div class="done-head"><span>In the basket · ${done.length}</span>
              <button class="clear" onClick=${actions.clearChecked}>Clear</button></div>
              <ul class="items">${done.map((it) => html`<${ItemRow} key=${it.id} item=${it} />`)}</ul>`}`}
    </main>
    ${toast}
  </div>`;
}

function Welcome() {
  return html`<div class="wrap">
    <div class="hero"><span class="mark">✓</span>
      <h1>Your family<br/>shopping list.</h1>
      <p class="lede">One list everyone at home can add to. Start it here, then share the link with your family.</p></div>
    <button class="primary" onClick=${actions.createList}>Start the list</button>
    <p class="subtle">Got a link from someone at home? Just open it — you’ll join their list automatically.</p>
  </div>`;
}

function App() {
  const s = useStore();
  if (s.screen === 'loading') return html`<div class="boot"><span class="mark">✓</span></div>`;
  if (s.screen === 'welcome') return html`<${Welcome} />`;
  return html`<${ListView} />`;
}

try { render(html`<${App} />`, document.getElementById('app')); boot(); }
catch (e) { document.getElementById('app').innerHTML =
  '<div style="max-width:30rem;margin:18vh auto;padding:0 1.6rem;font-family:system-ui,sans-serif;text-align:center">' +
  '<h2 style="font-size:1.2rem;color:#c23d2b">Couldn’t start</h2><p style="color:#6d6b5f;line-height:1.55">' + String(e) + '</p></div>';
  console.error(e); }
</script>

<!--
  BASIC SHOPPING LIST — how it works
  ==================================
  • First open → "Start the list" generates a key, stored on the device. No
    passphrase, no login. You're straight into the list.
  • Share → a link containing the key in the URL fragment (after '#'). The
    fragment is never sent to the host, so the server never sees the key.
    Whoever opens the link joins the same list.
  • The list is NIP-44 encrypted on the relays, so it isn't public — but anyone
    with the link can read and edit it. That's the intended tradeoff for a
    family grocery list.
  • Still a PWA: installable + works offline (service worker caches the shell
    and the CDN modules; sync resumes when back online).

  Deploy: serve index.html + manifest.webmanifest + sw.js + icons/ together,
  same-origin, over HTTPS. Drag the folder onto Netlify Drop, or push to GitHub
  Pages / Cloudflare Pages.

  Losing the list: it lives under the key in the link. If someone clears their
  browser storage and doesn't have the link saved, they'd start a fresh empty
  list — so the "share/save the link" nudge is the backup story.
-->
</body>
</html>
