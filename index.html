<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#eef0ea" />
<meta name="description" content="A shared family shopping list." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Pantry" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Pantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#eef0ea; --card:#fbfbf8; --card-edge:#e4e6de;
    --ink:#232219; --ink-soft:#6d6b5f; --ink-faint:#a6a498; --line:#e0e2d9;
    --pen:#2a27c4; --pen-ink:#211fa0; --pen-wash:#ecebfb;
    --prio-red:#d64545;
    --fresh:#3c8a57; --alert:#c23d2b;
    --r-sm:6px; --r-md:12px; --r-lg:20px;
    --font-display:'Bricolage Grotesque', system-ui, sans-serif;
    --font-mono:'Space Mono', ui-monospace, monospace;
    --tap:48px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--paper); color:var(--ink);
    font-family:var(--font-display); -webkit-font-smoothing:antialiased; }
  button { font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input { font:inherit; color:inherit; }
  :focus-visible { outline:2.5px solid var(--pen); outline-offset:2px; border-radius:3px; }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.001ms!important; transition-duration:.001ms!important; } }

  .mark { display:grid; place-items:center; background:var(--pen); color:#fff; border-radius:14px; transform:rotate(-5deg); }
  .boot { min-height:100dvh; display:grid; place-items:center; }
  .boot .mark { width:52px; height:52px; font-size:1.5rem; animation:tilt 1.4s ease-in-out infinite alternate; }
  @keyframes tilt { from{transform:rotate(-5deg);} to{transform:rotate(5deg);} }

  /* welcome */
  .wrap { max-width:26rem; margin:0 auto; padding:2.4rem 1.4rem 3rem; display:flex; flex-direction:column; gap:.9rem; }
  .hero { text-align:center; margin-bottom:1rem; }
  .hero .mark { width:56px; height:56px; font-size:1.6rem; margin:0 auto 1.2rem; }
  h1 { font-size:2rem; line-height:1.05; font-weight:700; letter-spacing:-.03em; margin:0 0 .8rem; }
  .lede { color:var(--ink-soft); line-height:1.55; margin:0; }
  .primary { height:52px; background:var(--pen); color:#fff; font-weight:600; font-size:1rem;
    border-radius:var(--r-md); transition:background .15s, opacity .15s; }
  .primary:disabled { opacity:.4; }
  .primary:not(:disabled):hover { background:var(--pen-ink); }
  .subtle { text-align:center; color:var(--ink-faint); font-size:.9rem; margin:.2rem 0 0; line-height:1.5; }

  /* list */
  .bar { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.1rem .4rem; }
  .brand { display:flex; align-items:center; gap:.5rem; }
  .brand .mark { width:28px; height:28px; font-size:.9rem; border-radius:8px; transform:rotate(-4deg); }
  .bar h1 { font-size:1.15rem; margin:0; letter-spacing:-.02em; }
  .share { display:flex; align-items:center; gap:.35rem; font-weight:600; font-size:.85rem;
    color:var(--pen-ink); background:var(--pen-wash); padding:.5rem .85rem; border-radius:999px; }
  .share:hover { background:#e2e0fb; }
  .status { display:flex; align-items:center; gap:.4rem; padding:0 1.2rem .7rem;
    font-family:var(--font-mono); font-size:.72rem; color:var(--ink-soft); }
  .status .dot { width:7px; height:7px; border-radius:50%; background:var(--ink-faint); }
  .status.live .dot { background:var(--fresh); }
  .status.err { color:var(--alert); } .status.err .dot { background:var(--alert); }

  .banner { margin:0 1.1rem .6rem; padding:.85rem 1rem; background:var(--card); border:2px solid var(--pen-wash);
    border-radius:var(--r-md); display:flex; align-items:center; gap:.75rem; }
  .banner p { margin:0; font-size:.9rem; line-height:1.45; color:var(--ink); flex:1; }
  .banner .b-share { font-weight:600; font-size:.85rem; color:#fff; background:var(--pen);
    padding:.5rem .85rem; border-radius:var(--r-sm); white-space:nowrap; }
  .banner .b-share:hover { background:var(--pen-ink); }
  .banner .dismiss { color:var(--ink-faint); font-size:1.3rem; line-height:1; padding:.2rem; }

  .add { position:sticky; top:0; z-index:5; display:flex; gap:.5rem; padding:.5rem 1.1rem .7rem;
    background:linear-gradient(var(--paper) 78%, transparent); }
  .add input { flex:1; min-width:0; height:var(--tap); padding:0 1rem; border:2px solid var(--card-edge);
    border-radius:var(--r-md); background:var(--card); font-size:1rem; }
  .add input:focus { border-color:var(--pen); outline:none; }
  .add-btn { height:var(--tap); padding:0 1.2rem; background:var(--pen); color:#fff; font-weight:600;
    border-radius:var(--r-md); transition:background .15s, opacity .15s; }
  .add-btn:disabled { opacity:.4; }
  .add-btn:not(:disabled):hover { background:var(--pen-ink); }
  main { padding:0 1.1rem 6rem; }
  ul.items { list-style:none; margin:0; padding:0; }
  .empty { margin-top:20vh; text-align:center; padding:0 2rem; }
  .empty-head { font-size:1.15rem; font-weight:600; margin:0 0 .4rem; }
  .empty-sub { color:var(--ink-soft); margin:0; line-height:1.5; }
  .done-head { display:flex; align-items:center; justify-content:space-between; margin:1.6rem 0 .2rem;
    font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); }
  .clear { color:var(--pen-ink); } .clear:hover { text-decoration:underline; }

  .row { display:grid; grid-template-columns:var(--tap) 1fr auto; align-items:center;
    min-height:56px; padding:.35rem .25rem .35rem 0; border-bottom:1px solid var(--line); }
  .tick { height:var(--tap); display:grid; place-items:center; }
  .box { width:22px; height:22px; border:2.5px solid var(--pen); border-radius:6px; transition:background .15s; }
  .row.done .box { background:var(--pen); box-shadow:inset 0 0 0 3px var(--card); }
  .rbody { display:flex; align-items:baseline; gap:.6rem; min-width:0; }
  .name { flex:1; min-width:0; text-align:left; padding:0; font-size:1.06rem; font-weight:500; letter-spacing:-.01em;
    color:var(--ink); line-height:1.3; overflow-wrap:anywhere; transition:color .2s ease;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:pan-y; }
  .row.done .name { color:var(--ink-faint); text-decoration:line-through;
    text-decoration-color:var(--pen); text-decoration-thickness:2.5px; }
  /* inline urgent marker, sits just after the name */
  .udot { flex-shrink:0; align-self:center; width:10px; height:10px; border-radius:50%; background:var(--prio-red); }
  .name-input { flex:1; min-width:0; font-size:1.06rem; font-weight:500; padding:2px 6px;
    border:1px solid var(--pen); border-radius:var(--r-sm); background:var(--card); }
  .qty, .qty-input { font-family:var(--font-mono); font-size:.8rem; color:var(--ink-soft); flex-shrink:0; }
  .qty { padding:4px 6px; border-radius:var(--r-sm); }
  .qty:hover { background:var(--pen-wash); color:var(--pen-ink); }
  .row.done .qty { color:var(--ink-faint); }
  .qty-input { width:5.5rem; padding:4px 6px; border:1px solid var(--pen); border-radius:var(--r-sm); background:var(--card); }
  .del { width:var(--tap); height:var(--tap); font-size:1.5rem; line-height:1; color:var(--ink-faint); border-radius:var(--r-sm); }
  .del:hover { color:var(--alert); }

  .toast { position:fixed; left:50%; bottom:1.5rem; transform:translateX(-50%); z-index:40;
    background:var(--ink); color:#fff; font-size:.9rem; padding:.7rem 1.1rem; border-radius:999px;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.5); display:flex; align-items:center; gap:1rem; max-width:90vw; }
  .toast-undo { color:#fff; font-weight:700; text-decoration:underline; padding:.1rem .3rem; flex-shrink:0; }
  @keyframes flashbg { 0% { background:var(--pen-wash); } 100% { background:transparent; } }
  .row.flash { animation:flashbg 1.2s ease; }

  .brand { display:flex; align-items:center; gap:.5rem; padding:.2rem .3rem; border-radius:var(--r-sm); max-width:72%; }
  .brand:hover { background:var(--card); }
  .brand h1 { font-size:1.15rem; margin:0; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chev { color:var(--ink-faint); font-size:.7rem; flex-shrink:0; }

  .sheet-overlay { position:fixed; inset:0; background:rgba(35,34,25,.4); z-index:30; display:flex; align-items:flex-end; animation:fade .15s ease; }
  @keyframes fade { from{opacity:0;} to{opacity:1;} }
  .sheet { background:var(--paper); width:100%; max-height:82vh; overflow:auto;
    border-radius:var(--r-lg) var(--r-lg) 0 0; padding:1.1rem 1.1rem 2rem; animation:rise .2s ease; }
  @keyframes rise { from{transform:translateY(100%);} to{transform:translateY(0);} }
  .sheet h2 { font-size:1.1rem; font-weight:700; margin:.2rem 0 .8rem; }
  .hh { display:flex; align-items:center; gap:.6rem; padding:.65rem 0; border-bottom:1px solid var(--line); }
  .hh .tick2 { width:22px; height:22px; border-radius:50%; border:2px solid var(--card-edge);
    flex-shrink:0; display:grid; place-items:center; color:#fff; font-size:.72rem; }
  .hh.active .tick2 { border-color:var(--pen); background:var(--pen); }
  .hh-name { flex:1; text-align:left; font-size:1.02rem; font-weight:500; padding:.2rem 0; overflow-wrap:anywhere; }
  .hh.active .hh-name { color:var(--pen-ink); }
  .hh-input { flex:1; font-size:1rem; padding:.35rem .5rem; border:1px solid var(--pen); border-radius:var(--r-sm); background:var(--card); }
  .hh-edit, .hh-del { width:34px; height:34px; flex-shrink:0; color:var(--ink-faint); border-radius:var(--r-sm); font-size:1.05rem; }
  .hh-edit:hover, .hh-del:hover { background:var(--card); color:var(--ink); }
  .hh-del:hover { color:var(--alert); }
  .hh-confirm { color:#fff; background:var(--alert); font-size:.8rem; font-weight:600; padding:.4rem .7rem; border-radius:var(--r-sm); }
  .hh-cancel { color:var(--ink-soft); font-size:.8rem; padding:.4rem .5rem; }
  .sheet-actions { display:flex; flex-direction:column; gap:.6rem; margin-top:1.1rem; }
  .sheet-actions .primary, .sheet-actions .ghost { height:48px; }
  .join-row { display:flex; gap:.5rem; }
  .join-input { flex:1; min-width:0; height:48px; padding:0 .9rem; border:2px solid var(--card-edge);
    border-radius:var(--r-md); background:var(--card); font-size:.95rem; font-family:var(--font-mono); }
  .join-input:focus { border-color:var(--pen); outline:none; }
  .primary.sm { height:48px; padding:0 1.1rem; }

  .suggests { display:flex; gap:.45rem; overflow-x:auto; padding:0 1.1rem .7rem; scrollbar-width:none; }
  .suggests::-webkit-scrollbar { display:none; }
  .chip { flex-shrink:0; white-space:nowrap; font-size:.92rem; color:var(--pen-ink);
    background:var(--pen-wash); border:1px solid transparent; padding:.5rem .9rem; border-radius:999px;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:pan-x; }
  .chip:hover { border-color:var(--pen); }
  .chip .plus { color:var(--pen); font-weight:700; margin-right:.28rem; }

  .bar-right { display:flex; align-items:center; gap:.5rem; }
  .help-btn { width:38px; height:38px; border-radius:999px; background:var(--card); border:2px solid var(--card-edge);
    font-weight:700; font-size:1rem; color:var(--ink-soft); flex-shrink:0; }
  .help-btn:hover { border-color:var(--pen); color:var(--pen-ink); }
  .help-head { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; }
  .help-list { list-style:none; margin:.5rem 0 0; padding:0; }
  .help-list li { padding:.6rem 0; border-bottom:1px solid var(--line); line-height:1.5; font-size:.98rem; color:var(--ink); }
  .help-list b { font-weight:600; }
  .help-list i { font-style:normal; font-family:var(--font-mono); font-size:.85rem; color:var(--ink-soft); }
  .help-section { margin-top:1.4rem; padding-top:1.1rem; border-top:2px solid var(--card-edge); }
  .help-section h3 { font-size:1.05rem; font-weight:700; margin:0 0 .7rem; }
  .help-section p { margin:0 0 .75rem; line-height:1.55; font-size:.95rem; color:var(--ink); }
</style>
</head>
<body>
<div id="app"><div class="boot"><span class="mark">✓</span></div></div>

<!-- If the app never boots (file:// , a preview, or no connection), say so. -->
<script>
  window.__bootTimer = setTimeout(function () {
    if (window.__booted) return;
    document.getElementById('app').innerHTML =
      '<div style="max-width:30rem;margin:18vh auto;padding:0 1.6rem;font-family:system-ui,sans-serif;color:#232219;text-align:center">' +
      '<h2 style="font-size:1.25rem;margin:0 0 .6rem">Open this in a browser, over HTTPS</h2>' +
      '<p style="color:#6d6b5f;line-height:1.55">This didn’t load — it was probably opened from a file preview or without a connection. Host it over HTTPS and open the URL in your browser.</p></div>';
  }, 8000);
</script>
<script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('[sw]', e)));
  }
</script>

/* --- IndexedDB (a cache; the shareable link is the real backup) ----------- */
const DBN = 'shoppinglist';
let _db;
function db() {

function observeItem(i) { for (const k of ['name','qty','note','cat','checked','deleted','prio']) { const r = i[k]; if (r) observe(r.t); } }

/* --- identity + encryption ------------------------------------------------ */

/* --- sync: subscribe → decrypt → merge → republish -----------------------
 *  1. never publish unmerged state (events replace-by-newest at the relay)
 *  2. created_at must beat the newest we've accepted (relays tie-break by id)
 *  3. if our merge differs from a peer's, republish (heals offline devices) */
class ListSync {
  constructor(opts) { this.opts = opts; this.sk = opts.secretKey; this.cipher = makeCipher(opts.secretKey);
    this.dTag = deriveDTag(this.cipher.pubkey, opts.listName); this.relays = opts.relays; this.pool = new SimplePool();
    this.clientId = ''; this.state = EMPTY_STATE; this.lastCreatedAt = 0; this.dirty = false;
    this.sub = null; this.debounce = null; this.retry = null; this.retryDelay = 2000; this.publishing = false; this.seen = new Set(); }
  get listId() { return `${this.cipher.pubkey}:${this.dTag}`; }
  async start() {
    this.clientId = (await getMeta('clientId')) || (await (async () => { const c = newClientId(); await setMeta('clientId', c); return c; })());
    const snap = (await loadSnap(this.listId)) || { state: EMPTY_STATE, lastCreatedAt: 0, dirty: false };
    this.state = snap.state; this.lastCreatedAt = snap.lastCreatedAt; this.dirty = snap.dirty;
    this.opts.onState(this.state); this.refresh();
    // Cover every way the app can come to the foreground: tab switch, window
    // focus, reconnect, and — importantly for an installed PWA — bfcache/resume.
    document.addEventListener('visibilitychange', this._wake);
    addEventListener('online', this._wake); addEventListener('focus', this._wake); addEventListener('pageshow', this._wake);
    if (this.dirty) this._schedule(0); }
  stop() { document.removeEventListener('visibilitychange', this._wake);
    removeEventListener('online', this._wake); removeEventListener('focus', this._wake); removeEventListener('pageshow', this._wake);
    clearTimeout(this.debounce); clearTimeout(this.retry); this.sub?.close(); this.pool.close(this.relays); }
  _wake = () => { if (document.visibilityState === 'hidden') return; this.refresh(); if (this.dirty) this._schedule(0); };
  // Re-open the live subscription AND actively pull the latest event now, so
  // opening the app always shows what others added rather than waiting.
  async refresh() {
    const t = Date.now();
    if (t - (this._lastRefresh || 0) < 1500) return; // coalesce focus+visibility+pageshow
    this._lastRefresh = t;
    this.opts.onStatus?.({ pending: true });
    this._subscribe();
    try {
      const evs = await this.pool.querySync(this.relays,
        { kinds: [LIST_KIND], authors: [this.cipher.pubkey], '#d': [this.dTag] });
      for (const ev of evs) this._onRemote(ev);

    } catch { /* offline — the live subscription will catch up when back */ }
  }
  _subscribe() { this.sub?.close();
    this.sub = this.pool.subscribeMany(this.relays,
      [{ kinds: [LIST_KIND], authors: [this.cipher.pubkey], '#d': [this.dTag] }],
      { onevent: (ev) => this._onRemote(ev), oneose: () => this.opts.onStatus?.({ online: true }) }); }
  _onRemote(ev) { if (this.seen.has(ev.id)) return; this.seen.add(ev.id);
    let incoming; try { incoming = this.cipher.decrypt(ev.content); } catch { return; }
    if (ev.created_at > this.lastCreatedAt) this.lastCreatedAt = ev.created_at; observe(ev.created_at * 1000);
    const merged = mergeList(this.state, incoming);
    const changed = !statesEqual(merged, this.state); const senderBehind = !statesEqual(merged, incoming);
    this.state = merged; this.opts.onStatus?.({ online: true, lastSyncedAt: Date.now() });
    if (changed) this.opts.onState(this.state); if (changed || senderBehind) this._persist();
    if (senderBehind) { this.dirty = true; this._schedule(); } }
  mutate(fn) { const next = fn(this.state, this.clientId); if (statesEqual(next, this.state)) return;
    this.state = next; this.dirty = true; this.opts.onState(this.state); this._persist(); this._schedule(); }
  _schedule(delay = 800) { clearTimeout(this.debounce); this.debounce = setTimeout(() => this._flush(), delay); this.opts.onStatus?.({ pending: true }); }
  async _flush() { if (this.publishing || !this.dirty) return; this.publishing = true; this.dirty = false;
    this.state = pruneTombstones(this.state); const snapshot = this.state;
    try {
      const tmpl = { kind: LIST_KIND, created_at: Math.max(Math.floor(Date.now() / 1000), this.lastCreatedAt + 1),
        tags: [['d', this.dTag]], content: this.cipher.encrypt(snapshot) };

/* --- controller ----------------------------------------------------------- */
const store = (() => { let s = { screen: 'loading', items: [], status: { online: false, pending: false },
    showSave: false, households: [], activeId: null, activeName: 'Pantry', sheetOpen: false,
    suggestions: [], toast: null, flashId: null, helpOpen: false };
  const subs = new Set();
  return { get: () => s, set: (p) => { s = { ...s, ...p }; subs.forEach((f) => f(s)); }, sub: (f) => { subs.add(f); return () => subs.delete(f); } }; })();

let sync = null; let identity = null;
let households = [];   // [{ id: npub, name, sk: hex }]
let activeId = null;

function pushHouseholds() {
  const active = households.find((h) => h.id === activeId);
  store.set({ households: households.map((h) => ({ id: h.id, name: h.name })), activeId,
    activeName: active ? active.name : 'Pantry' });
}
const persist = () => Promise.all([setMeta('households', households), setMeta('activeId', activeId)]);
function nextName(base) {
  const names = new Set(households.map((h) => h.name));
  if (!names.has(base)) return base;
  let i = 2; while (names.has(`${base} ${i}`)) i++; return `${base} ${i}`;
}

// Start syncing the active household's list. Each household has its own key,
// so its own listId and its own cached snapshot — switching is just this.
async function adopt(skHex) {
  identity = identityFrom(hexToBytes(skHex));
  await requestPersistence();
  sync?.stop();
  sync = new ListSync({ secretKey: identity.sk, relays: DEFAULT_RELAYS, listName: LIST_NAME,
    onState: (st) => store.set({ items: visibleItems(st), suggestions: recentNames(st) }),
    onStatus: (patch) => store.set({ status: { ...store.get().status, ...patch } }) });
  await sync.start();
}

async function switchTo(id) {
  const h = households.find((x) => x.id === id); if (!h) return;
  activeId = id; await persist(); pushHouseholds();
  store.set({ screen: 'list', items: [], sheetOpen: false, showSave: false });
  await adopt(h.sk);
}

// A key (nsec) becomes a household. Adds if new, just switches if we already
// have it — so opening a link never overwrites an existing list.
function keyFromText(text) {
  const t = (text || '').trim();
  const m = t.match(/[#&?]k=([a-z0-9]+)/i);
  if (m) return m[1];
  if (t.toLowerCase().startsWith('nsec1')) return t;
  return null;
}
async function joinKey(nsecOrKey, defaultName) {
  const id = parseNsec(nsecOrKey);            // throws if invalid
  const existing = households.find((h) => h.id === id.npub);
  if (existing) { await switchTo(existing.id); return 'switched'; }
  households.push({ id: id.npub, name: nextName(defaultName || 'Shared list'), sk: bytesToHex(id.sk) });
  await persist();
  await switchTo(id.npub);
  return 'joined';
}

async function boot() {
  // A shared link carries the key in the URL fragment (never sent to the host).
  const p = new URLSearchParams(location.search);
  const shared = p.get('share_title') || p.get('share_text'); // Web Share Target
  if (shared) { store.set({ pendingAdd: shared.trim() }); history.replaceState(null, '', location.pathname); }

  households = (await getMeta('households')) || [];
  activeId = await getMeta('activeId');

  // Migrate the old single-key format into a household.
  const legacy = await getMeta('sk');
  if (legacy && households.length === 0) {
    const id = identityFrom(hexToBytes(legacy));
    households = [{ id: id.npub, name: 'My list', sk: legacy }];
    activeId = id.npub; await persist(); await delMeta('sk');
  }

  const linkKey = new URLSearchParams(location.hash.slice(1)).get('k');
  if (linkKey) {
    try {
      await joinKey(linkKey, 'Shared list');
      history.replaceState(null, '', location.pathname + location.search); // strip key from the address bar
      return;
    } catch { /* invalid key — fall through */ }
  }

  if (households.length) {
    if (!households.find((h) => h.id === activeId)) activeId = households[0].id;
    await switchTo(activeId);
  } else {
    store.set({ screen: 'welcome' });
  }
}

const actions = {
  openSheet: () => store.set({ sheetOpen: true }),
  closeSheet: () => store.set({ sheetOpen: false }),
  openHelp: () => store.set({ helpOpen: true }),
  closeHelp: () => store.set({ helpOpen: false }),
  switchTo,
  createList: async () => {
    const id = createIdentity();
    households.push({ id: id.npub, name: nextName('New list'), sk: bytesToHex(id.sk) });
    await persist();
    await switchTo(id.npub);
    store.set({ showSave: true });
  },
  joinFromText: async (text) => {
    const key = keyFromText(text);
    if (!key) return 'bad';
    try { await joinKey(key, 'Shared list'); return 'ok'; } catch { return 'bad'; }
  },
  rename: async (id, name) => {
    const h = households.find((x) => x.id === id); if (!h) return;
    h.name = name.trim() || h.name; await persist(); pushHouseholds();
  },
  removeHousehold: async (id) => {
    households = households.filter((h) => h.id !== id); await persist();
    if (activeId === id) {
      if (households.length) { await switchTo(households[0].id); }
      else { sync?.stop(); sync = null; identity = null; activeId = null; await setMeta('activeId', null);
        pushHouseholds(); store.set({ screen: 'welcome', sheetOpen: false, items: [] }); }
    } else { pushHouseholds(); }
  },
  shareLink: async () => {
    const url = location.origin + location.pathname + '#k=' + identity.nsec;
    try {
      if (navigator.share) { await navigator.share({ title: 'Our shopping list', text: 'Open our shared shopping list', url }); return 'shared'; }
      await navigator.clipboard.writeText(url); return 'copied';
    } catch (e) { if (String(e).includes('Abort')) return 'shared';
      try { await navigator.clipboard.writeText(url); return 'copied'; } catch { return 'fail'; } }
  },
  dismissSave: () => store.set({ showSave: false }),
  showToast,
  undo: () => { const fn = pendingUndo; pendingUndo = null; store.set({ toast: null }); if (fn) fn(); },
  // "milk, eggs, bread" → three items. Skips anything already on the list
  // (flashing the existing row instead of adding a duplicate).
  add: (raw) => {
    if (!sync) return;
    const parts = (raw || '').split(',').map((x) => x.trim()).filter(Boolean);
    let added = false;
    for (const n of parts) { if (addOne(n)) added = true; }
    if (added) maybeHintUrgent();
  },
  toggle: (it) => sync?.mutate((s, c) => setChecked(s, c, it.id, !it.checked.v)),
  remove: (it) => {
    const id = it.id, name = it.name.v;
    sync?.mutate((s, c) => removeItem(s, c, id));
    showToast(`Removed "${name}"`, () => sync?.mutate((s, c) => restoreItem(s, c, id)));
  },
  setQty: (it, q) => sync?.mutate((s, c) => setQty(s, c, it.id, q)),
  renameItem: (it, name) => { const n = name.trim(); if (n) sync?.mutate((s, c) => setName(s, c, it.id, n)); },
  toggleUrgent: (it) => {
    const cur = (it.prio && it.prio.v) === 'red';
    sync?.mutate((s, c) => setPrio(s, c, it.id, cur ? '' : 'red'));
  },
  clearChecked: () => {
    const ids = store.get().items.filter((i) => i.checked.v).map((i) => i.id);
    if (!ids.length || !sync) return;
    sync.mutate((s, c) => ids.reduce((acc, id) => removeItem(acc, c, id), s));
    showToast(`Cleared ${ids.length} item${ids.length > 1 ? 's' : ''}`,
      () => sync.mutate((s, c) => ids.reduce((acc, id) => restoreItem(acc, c, id), s)));
  },
  forgetSuggestion: (name) => {
    if (!sync) return;
    sync.mutate((st) => forgetName(st, name));
    showToast(`Removed "${name}" from suggestions`, () => sync.mutate((st) => rememberName(st, name)));
  },
};

// --- toast + undo + flash -------------------------------------------------
let pendingUndo = null; let toastTimer = null; let flashTimer = null;
function showToast(msg, undoFn, ms) {
  pendingUndo = undoFn || null;
  store.set({ toast: { msg, canUndo: !!undoFn } });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { pendingUndo = null; store.set({ toast: null }); }, ms || (undoFn ? 5000 : 1800));
}
function flash(id) {
  store.set({ flashId: id });
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => store.set({ flashId: null }), 1200);
}
function addOne(name) {
  const existing = store.get().items.find((i) => i.name.v.toLowerCase() === name.toLowerCase());
  if (existing) {
    // already here — if it was ticked off, bring it back; either way, flash it.
    if (existing.checked.v) sync.mutate((s, c) => setChecked(s, c, existing.id, false));
    flash(existing.id);
    return false;
  }
  sync.mutate((s, c) => addItem(s, c, { name }));
  return true;
}
// Shown once ever (per device): teaches the hidden hold-to-flag gesture.
async function maybeHintUrgent() {
  if (await getMeta('hintUrgent')) return;
  await setMeta('hintUrgent', true);
  showToast('Tip: press and hold an item to flag it urgent', null, 5000);
}

/* --- UI ------------------------------------------------------------------- */
function useStore() { const [s, setS] = useState(store.get()); useEffect(() => store.sub(setS), []); return s; }

function Toast() {
  const s = useStore();
  if (!s.toast) return null;
  return html`<div class="toast">
    <span>${s.toast.msg}</span>
    ${s.toast.canUndo && html`<button class="toast-undo" onClick=${actions.undo}>Undo</button>`}
  </div>`;
}

function ShareButton({ className, label, onDone }) {
  const go = async () => {
    const r = await actions.shareLink();
    if (r === 'copied') { actions.showToast('Link copied — send it to your family'); }
    else if (r === 'fail') { actions.showToast('Could not share'); }
    onDone?.();
  };
  return html`<button class=${className} onClick=${go}>${label}</button>`;
}

function Chip({ name, onAdd, canForget }) {
  const timer = useRef(null);
  const longFired = useRef(false);
  const startXY = useRef(null);
  const clear = () => { if (timer.current) { clearTimeout(timer.current); timer.current = null; } };
  const start = (e) => {
    if (!canForget) return;
    longFired.current = false;
    startXY.current = { x: e.clientX, y: e.clientY };
    timer.current = setTimeout(() => {
      longFired.current = true; timer.current = null;
      if (navigator.vibrate) navigator.vibrate(15);
      actions.forgetSuggestion(name);
    }, 500);
  };
  const move = (e) => {
    if (!startXY.current) return;
    if (Math.abs(e.clientX - startXY.current.x) > 10 || Math.abs(e.clientY - startXY.current.y) > 10) clear();
  };
  const click = (e) => { if (longFired.current) { e.preventDefault(); longFired.current = false; return; } onAdd(); };
  return html`<button class="chip" title=${canForget ? 'Add ' + name + ' — hold to remove' : 'Add ' + name}
    onPointerDown=${start} onPointerMove=${move} onPointerUp=${clear} onPointerLeave=${clear} onPointerCancel=${clear}
    onContextMenu=${(e) => { if (!canForget) return; e.preventDefault(); clear(); if (!longFired.current) { longFired.current = true; actions.forgetSuggestion(name); } }}
    onClick=${click}><span class="plus">+</span>${name}</button>`;
}

function Help() {
  return html`<div class="sheet-overlay" onClick=${(e) => { if (e.target.classList.contains('sheet-overlay')) actions.closeHelp(); }}>
    <div class="sheet help">
      <div class="help-head"><h2>How to use Pantry</h2>
        <button class="dismiss" aria-label="Close" onClick=${actions.closeHelp}>×</button></div>
      <ul class="help-list">
        <li><b>Add items.</b> Type and tap Add. Add several at once with commas — <i>milk, tofu, bread</i>.</li>
        <li><b>Suggestions.</b> As you type, tap a suggestion to add it, or press and hold one to hide it.</li>
        <li><b>Tick off.</b> Tap the box as you shop. Done items drop into “In the basket”; tap <b>Clear</b> to empty it.</li>
        <li><b>Quantity.</b> Tap “+ qty” next to an item to note how many.</li>
        <li><b>Rename.</b> Tap an item’s name to edit it.</li>
        <li><b>Mark urgent.</b> Press and <b>hold</b> an item’s name — it gets a red dot and jumps to the top.</li>
        <li><b>Undo.</b> Removing an item or clearing the basket shows an Undo button for a few seconds.</li>
        <li><b>Share.</b> Tap Share to send the list to your family. Whoever opens the link joins the same list.</li>
        <li><b>More lists.</b> Tap the list name at the top to switch between lists, rename them, or add a new one.</li>
      </ul>
      <div class="help-section">
        <h3>How it works</h3>
        <p>Your list lives on <b>nostr</b>, an open network of relays — there’s no company server holding your shopping, and no account to sign up for.</p>
        <p>Sharing the link shares the key to the list. The key sits after the “#” in the link, which your browser never sends to whoever hosts the page — so the host can’t read it either.</p>
        <p>Because everyone shares one key, <b>anyone with the link can view and edit</b> the list. That’s the trade-off for joining with zero setup, and it’s fine for a family shopping list.</p>
        <p>The list is encrypted on the network, keeps working with no signal in the shop, and installs to your home screen like a normal app.</p>
        <p><b>Keep the link.</b> It’s how you share the list and how you get back to it — save it somewhere safe, like a pinned family chat message.</p>
      </div>
    </div>
  </div>`;
}

function ItemRow({ item, flash }) {
  const done = item.checked.v;
  const [editing, setEditing] = useState(false);   // quantity
  const [draft, setDraft] = useState('');
  const commit = () => { setEditing(false); if (draft.trim() !== item.qty.v) actions.setQty(item, draft.trim()); };

  const [editName, setEditName] = useState(false);
  const [nameDraft, setNameDraft] = useState('');
  const commitName = () => { setEditName(false); if (nameDraft.trim() && nameDraft.trim() !== item.name.v) actions.renameItem(item, nameDraft); };

  // Tap the name to rename; hold it to toggle "urgent" (same gesture as chips).
  const holdTimer = useRef(null);
  const held = useRef(false);
  const holdXY = useRef(null);
  const holdCancel = () => { if (holdTimer.current) { clearTimeout(holdTimer.current); holdTimer.current = null; } };
  const holdStart = (e) => {
    held.current = false; holdXY.current = { x: e.clientX, y: e.clientY };
    holdTimer.current = setTimeout(() => {
      held.current = true; holdTimer.current = null;
      if (navigator.vibrate) navigator.vibrate(15);
      actions.toggleUrgent(item);
    }, 500);
  };
  const holdMove = (e) => { if (holdXY.current && (Math.abs(e.clientX - holdXY.current.x) > 10 || Math.abs(e.clientY - holdXY.current.y) > 10)) holdCancel(); };
  const nameClick = (e) => { if (held.current) { e.preventDefault(); held.current = false; return; } setNameDraft(item.name.v); setEditName(true); };

  const urgent = !done && (item.prio && item.prio.v) === 'red';

  return html`<li class=${'row' + (done ? ' done' : '') + (flash ? ' flash' : '')}>
    <button class="tick" role="checkbox" aria-checked=${done}
      aria-label=${done ? 'Uncheck ' + item.name.v : 'Check off ' + item.name.v}
      onClick=${() => actions.toggle(item)}><span class="box"></span></button>
    <div class="rbody">
      ${editName
        ? html`<input class="name-input" autofocus value=${nameDraft} aria-label="Item name"
            onInput=${(e) => setNameDraft(e.target.value)} onBlur=${commitName}
            onKeyDown=${(e) => e.key === 'Enter' && commitName()} />`
        : html`<button class="name" title="Tap to rename · hold to flag urgent"
            onPointerDown=${holdStart} onPointerMove=${holdMove} onPointerUp=${holdCancel}
            onPointerLeave=${holdCancel} onPointerCancel=${holdCancel}
            onContextMenu=${(e) => e.preventDefault()} onClick=${nameClick}>${item.name.v}</button>`}
      ${urgent && html`<span class="udot" title="Urgent" aria-label="Urgent"></span>`}
      ${editing
        ? html`<input class="qty-input" autofocus value=${draft} placeholder="qty" aria-label="Quantity"
            onInput=${(e) => setDraft(e.target.value)} onBlur=${commit} onKeyDown=${(e) => e.key === 'Enter' && commit()} />`
        : html`<button class="qty" onClick=${() => { setDraft(item.qty.v); setEditing(true); }}>${item.qty.v || '+ qty'}</button>`}
    </div>
    <button class="del" aria-label=${'Remove ' + item.name.v} onClick=${() => actions.remove(item)}>×</button>
  </li>`;
}

// Empty field → recent history (minus anything already on the list). Typing →
// matches from history + dictionary, hiding only items that are ACTIVE on the
// list; basket (checked) items still surface so you can find and re-add them.
function buildSuggestions(history, q, excludeAll, excludeActive) {
  if (!q) return history.filter((n) => !excludeAll.has(n.toLowerCase())).slice(0, 12).map((n) => ({ name: n, personal: true }));
  const seen = new Set(); const pool = [];
  for (const n of history) { const k = n.toLowerCase(); if (!seen.has(k)) { seen.add(k); pool.push({ name: n, personal: true }); } }
  for (const n of COMMON_ITEMS) { const k = n.toLowerCase(); if (!seen.has(k)) { seen.add(k); pool.push({ name: n, personal: false }); } }
  const scored = [];
  for (const p of pool) {
    const k = p.name.toLowerCase();
    if (excludeActive.has(k) || k.indexOf(q) === -1) continue;
    scored.push({ ...p, rank: (k.startsWith(q) ? 0 : 2) + (p.personal ? 0 : 1), len: p.name.length });
  }
  scored.sort((a, b) => a.rank - b.rank || a.len - b.len || a.name.localeCompare(b.name));
  return scored.slice(0, 12);
}

function ListView() {
  const s = useStore();
  const [draft, setDraft] = useState(s.pendingAdd || '');
  useEffect(() => { if (s.pendingAdd) setDraft(s.pendingAdd); }, [s.pendingAdd]);
  const open = s.items.filter((i) => !i.checked.v);
  const done = s.items.filter((i) => i.checked.v);
  const label = s.status.error ? 'offline — changes saved here'
    : s.status.pending ? 'saving…' : s.status.online ? 'up to date' : 'connecting…';
  const submit = (e) => { e.preventDefault(); actions.add(draft); setDraft(''); };
  return html`<div>
    <header class="bar">
      <button class="brand" onClick=${actions.openSheet} aria-label="Switch list">
        <span class="mark">✓</span><h1>${s.activeName}</h1><span class="chev">▼</span></button>
      <div class="bar-right">
        <button class="help-btn" onClick=${actions.openHelp} aria-label="Help and how it works">?</button>
        <${ShareButton} className="share" label=${html`<span>Share</span>`} />
      </div>
    </header>
    <div class=${'status' + (s.status.error ? ' err' : s.status.online && !s.status.pending ? ' live' : '')}>
      <span class="dot"></span>${label}</div>

    ${s.showSave && html`<div class="banner">
      <p>Share this list with your family so everyone can add to it — and so you don’t lose it.</p>
      <${ShareButton} className="b-share" label="Share" onDone=${actions.dismissSave} />
      <button class="dismiss" aria-label="Dismiss" onClick=${actions.dismissSave}>×</button>
    </div>`}

    <form class="add" onSubmit=${submit}>
      <input value=${draft} placeholder="Add an item…" aria-label="Add an item" autocomplete="off"
        enterkeyhint="done" onInput=${(e) => setDraft(e.target.value)} />
      <button class="add-btn" type="submit" disabled=${!draft.trim()} aria-label="Add">Add</button>
    </form>
    ${(() => {
      const all = new Set(s.items.map((i) => i.name.v.toLowerCase()));
      const active = new Set(s.items.filter((i) => !i.checked.v).map((i) => i.name.v.toLowerCase()));
      const sugg = buildSuggestions(s.suggestions || [], draft.trim().toLowerCase(), all, active);
      return sugg.length > 0 && html`<div class="suggests">
        ${sugg.map((sg) => html`<${Chip} key=${sg.name} name=${sg.name} canForget=${sg.personal}
          onAdd=${() => { actions.add(sg.name); setDraft(''); }} />`)}
      </div>`;
    })()}
    <main>
      ${s.items.length === 0
        ? html`<div class="empty"><p class="empty-head">Nothing on the list yet.</p>
            <p class="empty-sub">Add the first thing above. Everyone you share the list with sees it.</p></div>`
        : html`<ul class="items">${open.map((it) => html`<${ItemRow} key=${it.id} item=${it} flash=${it.id === s.flashId} />`)}</ul>
            ${done.length > 0 && html`<div class="done-head"><span>In the basket · ${done.length}</span>
              <button class="clear" onClick=${actions.clearChecked}>Clear</button></div>
              <ul class="items">${done.map((it) => html`<${ItemRow} key=${it.id} item=${it} flash=${it.id === s.flashId} />`)}</ul>`}`}
    </main>
  </div>`;
}

function Welcome() {
  return html`<div class="wrap">
    <div class="hero"><span class="mark">✓</span>
      <h1>Your family<br/>shopping list.</h1>
      <p class="lede">One list everyone at home can add to. Start it here, then share the link with your family.</p></div>
    <button class="primary" onClick=${actions.createList}>Start the list</button>
    <p class="subtle">Got a link from someone at home? Just open it — you’ll join their list automatically.</p>
  </div>`;
}

function ListsSheet() {
  const s = useStore();
  const [editId, setEditId] = useState(null);
  const [nameDraft, setNameDraft] = useState('');
  const [confirmId, setConfirmId] = useState(null);
  const [joinOpen, setJoinOpen] = useState(false);
  const [joinText, setJoinText] = useState('');

  const startEdit = (h) => { setEditId(h.id); setNameDraft(h.name); };
  const commitEdit = () => { if (nameDraft.trim()) actions.rename(editId, nameDraft.trim()); setEditId(null); };
  const doJoin = async () => {
    const r = await actions.joinFromText(joinText);
    if (r === 'bad') actions.showToast("That link didn't work");
    else { setJoinOpen(false); setJoinText(''); }
  };

  return html`<div class="sheet-overlay"
      onClick=${(e) => { if (e.target.classList.contains('sheet-overlay')) actions.closeSheet(); }}>
    <div class="sheet">
      <h2>Your lists</h2>
      ${s.households.map((h) => html`<div class=${'hh' + (h.id === s.activeId ? ' active' : '')} key=${h.id}>
        <span class="tick2">${h.id === s.activeId ? '✓' : ''}</span>
        ${editId === h.id
          ? html`<input class="hh-input" autofocus value=${nameDraft} aria-label="List name"
              onInput=${(e) => setNameDraft(e.target.value)} onBlur=${commitEdit}
              onKeyDown=${(e) => e.key === 'Enter' && commitEdit()} />`
          : html`<button class="hh-name" onClick=${() => actions.switchTo(h.id)}>${h.name}</button>`}
        ${confirmId === h.id
          ? html`<button class="hh-confirm" onClick=${() => actions.removeHousehold(h.id)}>Remove</button>
                 <button class="hh-cancel" onClick=${() => setConfirmId(null)}>Cancel</button>`
          : html`<button class="hh-edit" aria-label="Rename list" onClick=${() => startEdit(h)}>✎</button>
                 <button class="hh-del" aria-label="Remove list" onClick=${() => setConfirmId(h.id)}>×</button>`}
      </div>`)}

      <div class="sheet-actions">
        ${joinOpen
          ? html`<div class="join-row">
              <input class="join-input" autofocus placeholder="Paste a shared link" value=${joinText}
                onInput=${(e) => setJoinText(e.target.value)} onKeyDown=${(e) => e.key === 'Enter' && doJoin()} />
              <button class="primary sm" onClick=${doJoin}>Join</button></div>`
          : html`<button class="ghost" onClick=${() => setJoinOpen(true)}>Join with a link</button>`}
        <button class="primary" onClick=${actions.createList}>Add a new list</button>
      </div>
    </div>
  </div>`;
}

function App() {
  const s = useStore();
  if (s.screen === 'loading') return html`<div class="boot"><span class="mark">✓</span></div>`;
  if (s.screen === 'welcome') return html`<div><${Welcome} /><${Toast} /></div>`;
  return html`<div><${ListView} />${s.sheetOpen && html`<${ListsSheet} />`}${s.helpOpen && html`<${Help} />`}<${Toast} /></div>`;
}

try { render(html`<${App} />`, document.getElementById('app')); boot(); }
catch (e) { document.getElementById('app').innerHTML =
  '<div style="max-width:30rem;margin:18vh auto;padding:0 1.6rem;font-family:system-ui,sans-serif;text-align:center">' +
  '<h2 style="font-size:1.2rem;color:#c23d2b">Couldn’t start</h2><p style="color:#6d6b5f;line-height:1.55">' + String(e) + '</p></div>';
  console.error(e); }
</script>

<!--
  PANTRY — how it works
  ==================================
  • First open → "Start the list" generates a key, stored on the device. No
    passphrase, no login. You're straight into the list.
  • Share → a link containing the key in the URL fragment (after '#'). The
    fragment is never sent to the host, so the server never sees the key.
    Whoever opens the link joins the same list.
  • The list is NIP-44 encrypted on the relays, so it isn't public — but anyone
    with the link can read and edit it. That's the intended tradeoff for a
    family grocery list.
  • Still a PWA: installable + works offline (service worker caches the shell
    and the CDN modules; sync resumes when back online).

  Deploy: serve index.html, manifest.webmanifest, sw.js and the icon PNGs
  together, same-origin, over HTTPS. Drag the folder onto Netlify Drop, or push to GitHub
  same-origin, over HTTPS. Drag the folder onto Netlify Drop, or push to GitHub
  Pages / Cloudflare Pages.

  Losing the list: it lives under the key in the link. If someone clears their
  browser storage and doesn't have the link saved, they'd start a fresh empty
  list — so the "share/save the link" nudge is the backup story.
-->
</body>
</html>
